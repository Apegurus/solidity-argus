pack_name: cross-chain-bridge
pack_version: "1.0"
patterns:
  - name: missing-chain-id-validation
    category: logic-error
    severity: High
    confidence: Medium
    version: "1.0"
    regex: '(abi\.encodePacked|keccak256)\s*\([^)]*(?!.*\b(block\.chainid|chainId)\b)[^)]*\)'
    description: Cross-chain message hash constructed without chain ID — signatures or proofs can be replayed on other chains where the contract is deployed at the same address
    remediation: Include block.chainid in all message hashes used for cross-chain verification; follow EIP-712 domain separator pattern with chainId field
    exploit_ref: https://rekt.news/wormhole-rekt/

  - name: replay-across-chains
    category: logic-error
    severity: High
    confidence: Medium
    version: "1.0"
    regex: 'ecrecover\s*\([^)]*(?!.*\b(chainId|block\.chainid)\b)[^)]*\)'
    description: Signature recovery without chain-specific binding — ecrecover call does not reference chainId, allowing signed messages to be replayed across chain forks or L2 deployments
    remediation: Bind signatures to chain by including block.chainid in the signed message hash; use EIP-712 typed data with domain separator containing chainId and verifyingContract

  - name: unverified-bridge-message
    category: logic-error
    severity: Critical
    confidence: High
    version: "1.0"
    regex: '(onMessageReceived|_processMessage|receiveMessage|handleBridgeMessage)\s*\('
    description: Bridge message receiver function detected — verify the caller is the authorized bridge contract and the source chain/sender are validated before processing
    remediation: Add require(msg.sender == trustedBridge) check; verify source chain ID and source sender address against an allowlist; use reentrancy guard on message handlers
    exploit_ref: https://rekt.news/nomad-rekt/

  - name: hardcoded-bridge-address
    category: logic-error
    severity: Medium
    confidence: High
    version: "1.0"
    regex: 'address\s+(constant|immutable)\s+\w*(bridge|Bridge|BRIDGE|relay|Relay|messenger|Messenger)\w*\s*='
    description: Hardcoded bridge or relay address — if the bridge contract is upgraded or redeployed, this contract cannot adapt without redeployment
    remediation: Use a configurable bridge address with an admin-controlled setter function behind a timelock; avoid hardcoded addresses for external protocol dependencies
