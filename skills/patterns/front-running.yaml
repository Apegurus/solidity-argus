pack_name: front-running
pack_version: "1.0"
patterns:
  - name: missing-slippage-protection
    category: front-running
    severity: High
    swc: SWC-114
    confidence: High
    version: "1.0"
    regex: 'swap\w*\([^)]*,\s*0\s*[,)]'
    description: Swap call with hardcoded zero as minimum output amount — allows unlimited slippage and enables sandwich attacks by MEV bots
    remediation: Calculate minimum output using an oracle or off-chain quote with acceptable slippage tolerance (e.g., 0.5%); never pass 0 as amountOutMin

  - name: missing-deadline
    category: front-running
    severity: Medium
    swc: SWC-114
    confidence: High
    version: "1.0"
    regex: '\bdeadline\s*[:=]\s*block\.timestamp\b'
    description: Using block.timestamp as transaction deadline provides no protection — validators can hold the transaction indefinitely and execute it when profitable
    remediation: Use a user-specified deadline (e.g., block.timestamp + 300 at submission time); pass deadline as a function parameter from the frontend

  - name: predictable-randomness
    category: front-running
    severity: High
    swc: SWC-120
    confidence: High
    version: "1.0"
    regex: 'keccak256\(abi\.encodePacked\(block\.(timestamp|number|prevrandao)'
    description: Using block variables (timestamp, number, prevrandao) as entropy in keccak256 — miners and validators can predict or manipulate these values to game randomness-dependent logic
    remediation: Use Chainlink VRF or similar verifiable random function; never derive randomness from block variables

  - name: commit-reveal-weakness
    category: front-running
    severity: Medium
    confidence: Medium
    version: "1.0"
    regex: 'function\s+commit\s*\(\s*(uint\d*|int\d*|address|bool|string)\s'
    description: Commit function accepts a raw value type instead of a hash — the committed value is visible in transaction calldata, enabling front-running before reveal phase
    remediation: Accept only bytes32 hash commitments; compute keccak256(abi.encodePacked(value, salt)) off-chain; include sender address and nonce in hash
