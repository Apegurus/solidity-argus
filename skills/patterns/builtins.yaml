pack_name: builtins
pack_version: "1.0"
patterns:
  - name: reentrancy-call-value
    category: reentrancy
    severity: High
    confidence: High
    version: "1.0"
    regex: '\.call\{value:'
    description: "Potential reentrancy: ETH transfer via low-level call"

  - name: tx-origin-auth
    category: access-control
    severity: High
    confidence: High
    version: "1.0"
    regex: 'tx\.origin'
    description: "Use of tx.origin for authorization - vulnerable to phishing"

  - name: selfdestruct-usage
    category: access-control
    severity: High
    confidence: High
    version: "1.0"
    regex: 'selfdestruct\(|suicide\('
    description: "Contract uses selfdestruct - can destroy contract"

  - name: delegatecall-usage
    category: delegatecall
    severity: High
    confidence: High
    version: "1.0"
    regex: '\.delegatecall\('
    description: "Use of delegatecall - can overwrite storage"

  - name: missing-zero-check
    category: access-control
    severity: Medium
    confidence: Medium
    version: "1.0"
    regex: 'address\(0\)'
    description: "Potential missing zero-address validation"
